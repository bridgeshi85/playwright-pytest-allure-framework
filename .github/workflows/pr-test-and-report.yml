name: PR Test & Allure Report

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Cancel in-progress runs for the same PR/branch.
concurrency:
  group: "pr-test-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Stage 1: Deploy demo-frontend & run Playwright tests ──
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Python test environment ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: playwright-automation-test/requirements.txt

      - name: Install Python dependencies
        working-directory: playwright-automation-test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # ---------- Node / demo-frontend ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: demo-frontend/package-lock.json

      - name: Install demo-frontend dependencies
        working-directory: demo-frontend
        run: npm ci

      - name: Build demo-frontend
        working-directory: demo-frontend
        run: npm run build

      - name: Serve demo-frontend on the test environment port
        working-directory: demo-frontend
        run: |
          npx serve dist -l 3000 --no-request-logging &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000 >/dev/null && exit 0 || sleep 1
          done
          exit 1

      # ---------- Override headless mode for CI ----------
      - name: Enable headless mode for CI
        run: |
          sed -i 's/headless: false/headless: true/' \
            playwright-automation-test/configs/env.default.yaml

      # ---------- Run Playwright tests ----------
      - name: Run Playwright tests
        id: playwright
        working-directory: playwright-automation-test
        run: |
          mkdir -p output
          pytest tests/test_login.py --env=default --tb=short --junitxml=output/triage-junit.xml

      - name: Upload E2E failure evidence
        if: failure() && steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-triage-${{ github.run_attempt }}
          path: |
            playwright-automation-test/output/triage-junit.xml
            playwright-automation-test/output/logs/test.log
            playwright-automation-test/output/screenshots/**/*.html
          retention-days: 7
          if-no-files-found: ignore

      # ---------- Upload Allure JSON results (always, even on test failure) ----------
      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: playwright-automation-test/output/reports/allure-results
          retention-days: 30
          if-no-files-found: ignore

  # ── Stage 2: Generate Allure HTML & deploy to GitHub Pages (main only) ──
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Download Allure results artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Setup Java (required by Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          curl -sSL https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz | tar -xz -C /opt/
          echo "/opt/allure-2.32.0/bin" >> $GITHUB_PATH

      - name: Generate Allure HTML report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
