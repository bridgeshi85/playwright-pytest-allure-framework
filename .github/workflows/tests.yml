name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: playwright-automation-test
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Start demo frontend
        run: |
          cd demo-frontend
          npm install
          npm run build
          npx serve -s dist -p 3000 &
          sleep 5

      - name: Run tests
        working-directory: playwright-automation-test
        run: |
          pytest tests/ \
            --alluredir=allure-results \
            --json-report \
            --json-report-file=test-results.json \
            -v \
            || true   # 不因失败中断，让 healer 处理

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            playwright-automation-test/test-results.json
            playwright-automation-test/allure-results/
          retention-days: 7
