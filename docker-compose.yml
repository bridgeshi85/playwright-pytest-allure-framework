version: '3.9'

services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    user: root # 以root用户运行，确保有权限访问docker.sock
    container_name: my-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock  # 挂载本机的docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock # 指示容器使用该socket
    networks:
      - e2e-test

  demo-frontend:
    build:
      context: ./demo-frontend
      dockerfile: Dockerfile
    container_name: demo-frontend
    ports:
      - "3000:80"          # 宿主机访问（可选）
    restart: unless-stopped
    networks:
      - e2e-test

  har-demo-api:
    build:
      context: ./har-demo-api
      dockerfile: Dockerfile
    container_name: har-demo-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - e2e-test
  
volumes:
  jenkins_home:

networks:
  e2e-test:
    name: e2e-test
