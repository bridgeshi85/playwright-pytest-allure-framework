name: PR Test & Allure Report

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR.
concurrency:
  group: "pr-test-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Stage 1: Deploy demo-frontend & run Playwright tests ──
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Python test environment ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: playwright-automation-test/requirements.txt

      - name: Install Python dependencies
        working-directory: playwright-automation-test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # ---------- Node / demo-frontend ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: demo-frontend/package-lock.json

      - name: Install demo-frontend dependencies
        working-directory: demo-frontend
        run: npm ci

      - name: Build demo-frontend
        working-directory: demo-frontend
        run: npm run build

      - name: Serve demo-frontend on port 5173
        working-directory: demo-frontend
        run: |
          npx serve dist -l 5173 --no-request-logging &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break || sleep 1
          done

      # ---------- Override headless mode for CI ----------
      - name: Enable headless mode for CI
        run: |
          sed -i 's/headless: false/headless: true/' \
            playwright-automation-test/configs/env.default.yaml

      # ---------- Run Playwright tests ----------
      - name: Run Playwright tests
        working-directory: playwright-automation-test
        run: |
          pytest --env=default --tb=short

      # ---------- Upload Allure JSON results (always, even on test failure) ----------
      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: playwright-automation-test/output/reports/allure-results
          retention-days: 30
          if-no-files-found: ignore

  # ── Stage 2: Generate Allure HTML & deploy to GitHub Pages ──
  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Download Allure results artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Setup Java (required by Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          curl -sSL https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz | tar -xz -C /opt/
          echo "/opt/allure-2.32.0/bin" >> $GITHUB_PATH

      - name: Generate Allure HTML report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
